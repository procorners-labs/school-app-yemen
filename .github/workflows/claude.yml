name: Claude Code

# استدعاءٌ عند الطلب بـ`@claude` في تعليق أو عدد.
# للمراجعة التلقائية عند فتح PR: `claude-review.yml` (ملفٌّ منفصل عمداً — لكلٍّ مُطلِقُه).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # 🔴 `assigned` أُسقط عمداً 2026-08-30: كان مُشغَّلاً والشرطُ أدناه يفحص **نصّ** العدد
  #    وعنوانه وحدهما ⇒ إسنادُ عدد بلا `@claude` في نصّه لا يشغّل شيئاً. قدرةٌ معلَنة
  #    لا تعمل أسوأ من غيابها — لأنها تُقرأ ضماناً قائماً.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

# 🔴 تسلسلٌ لا إلغاء: تعليقان متتاليان بـ`@claude` كانا يشغّلان مهمّتين متوازيتين على
#    نفس حصّة الاشتراك. و`cancel-in-progress: false` عمداً — إجابةٌ جاريةٌ على سؤالك
#    لا تُلغى بسؤالك التالي.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # 🔴 سقفٌ جامح — الافتراضي بلا هذا السطر **٣٦٠ دقيقة**. متوسّط التشغيلة الناجحة
    #    ٢٠٠ ثانية (مقيس على ١٢ تشغيلة/٧ أيام) ⇒ ٢٠ دقيقة هامشٌ ×٦.
    timeout-minutes: 20

    # 🔴 `write` وليس `read` — صُحِّح 2026-08-30، وهذا المستودع كان الأخير المتخلّف.
    # عطبُ `read` موثَّقٌ رسمياً: anthropics/claude-code-action#1562 — الإجراء يعمل ثمّ
    # **لا ينشر تعليقاً ولا مراجعة، بلا أي رسالة خطأ**. أي الفشلُ الصامت بعينه.
    # ⚠️ ودقّةٌ تمنع سوءَ فهم التغيير: هذه الكتلة تحكم `GITHUB_TOKEN` وحده. ومع تثبيت
    # تطبيق Claude يأتي حقُّ الكتابة من **توكن التطبيق** لا منها — ولذلك نجحت تشغيلةُ
    # school-app-yemen-web #147 رغم `read`. ⇒ العطلُ **كامنٌ لا واقع**: يظهر في أوّل
    # مستودعٍ يسقط فيه مسارُ التطبيق. والترقية تُغلق الفئة لا حادثة.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # ليقرأ Claude نتائج CI على الـPRs

    steps:
      - name: Checkout repository
        # 🔴 `@v7` لا `@v4`: الأخيرة تُنتج ٥ تحذيرات `Node.js 20 is deprecated` في كل
        #    تشغيلة — وتحذيرٌ دائمٌ يُعلّم تجاهُلَ التحذيرات فتسقط اللوحة عملياً.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # ٢٠١ تعليقاً من chatgpt-codex-connector[bot] عبر خمسة مستودعات، و٩٤ من ٩٤ في
          # مستودع الـGAS نصُّها الواحد «You have reached your Codex usage limits»
          # (قِيس 2026-08-29؛ عُطِّل البوت في التاريخ نفسه، وآخرُ تعليقٍ له 18:40:46Z).
          # هذا يستبعد تعليقاته من **سياق** Claude فلا تُقرأ ولا تُستهلَك توكناتُها،
          # ويبقى نافعاً لأن التعليقات الـ٢٠١ **لم تُحذف**.
          # ⚠️ وليس حارساً ضدّ استدعاء البوتات — ذاك مضمونٌ أصلاً بافتراض `allowed_bots: ""`.
          # 🔴 ولا يُوسَّع إلى `*[bot]`: تعليقات github-actions[bot] تحمل نتائجَ فحوصٍ
          #    قد يحتاجها Claude، واستبعادُها يُفقره بلا مقابل.
          exclude_comments_by_actor: "chatgpt-codex-connector[bot]"

          # 🔴 لا مدخل `model:` ولا `max_turns:` مستقلّ في v1 — كلاهما عبر `claude_args`
          #    حصراً، وهما **الطريقان الموثَّقان الوحيدان** لخفض الكلفة (لا `max_cost`).
          # 🟢 وبلا `--model` هنا عمداً: هذا استدعاءٌ صريحٌ ونادر (١٢ في ٧ أيام عبر كل
          #    المستودعات) ⇒ يستحقّ النموذج الكامل. التقييدُ بالنموذج مكانُه المراجعةُ
          #    التلقائية المتكرّرة في `claude-review.yml`.
          claude_args: |
            --max-turns 25
