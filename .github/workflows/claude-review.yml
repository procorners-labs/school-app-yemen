name: Claude Auto Review

# مراجعةٌ تلقائية بـ`claude[bot]` عند فتح PR — أُضيفت 2026-08-30.
# قبلها كان هذا المستودع (تطبيقٌ **منشور** على Play بـ٦٦٣ تثبيتاً) بلا أي مراجعة آلية.
#
# 🔴 ولماذا `opened, ready_for_review` ولا `synchronize`:
#    `synchronize` يُطلق مراجعةً عند **كل دفعةٍ** على الفرع ⇒ يعيد علّةَ الاستنزاف
#    التي عُطِّل بسببها بوتُ Codex، بحصّة Claude بدل حصّة Codex.
#    ⇒ مراجعةٌ واحدة عند الفتح، وأخرى عند الخروج من المسوّدة. وللمراجعة عند الطلب في
#    أي لحظةٍ أخرى: علّق `@claude` (ملفّ `claude.yml`).

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '_docs/**'

# إعادةُ فتحٍ أو خروجٌ من مسوّدة يُلغي المراجعة السابقة — هنا الإلغاء صحيح، بخلاف
# `claude.yml` حيث الإلغاء يقطع إجابةً على سؤال المستخدم.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # لا مراجعةَ لمسوّدة — تُراجَع حين تُعلَن جاهزة.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 🔴 `pull-requests: write` إلزاميّ — بـ`read` يعمل الإجراء ثمّ لا ينشر شيئاً
    #    بلا أي رسالة خطأ (anthropics/claude-code-action#1562).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 🔴 `continue-on-error` عمداً — واللونُ لم يعد هو الحكم.
      #    الحكمُ في خطوة «البوّابة» أدناه، وهي تقرأ **تعليقاً منشوراً** لا حالةَ خطوة.
      #    والسببُ مقيس: هذا الإجراء يفشل بوجهين، وأحدُهما **ينشر مراجعةً ناجحةً ثمّ
      #    يقلبها فشلاً**، والآخر يخضرّ بلا نشرِ شيء (‏`claude-action-green-on-validation-skip`).
      - name: Claude review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            راجع هذا الـPR بالعربية. فرعُ الـPR مسحوبٌ في دليل العمل الحالي.

            اقرأ `.github/claude-context.md` أوّلاً — فيه ثوابتُ هذا المستودع وفئاتُ
            علله المتكرّرة وما **ليس** عطلاً فيه.

            🔴 وهذه الأربعة تُكرَّر هنا عمداً ولا يُكتفى بالملفّ — ملفٌّ قد يُحذف أو
            يُنقل، ومطالبةٌ تعتمده وحده تصير جوفاء صامتة:
            1. **`applicationId` و`namespace` لا يُعادان تسميةً أبداً**
               (`com.proconrers.schoolappyemen`) — Firebase مسجَّلٌ عليهما، والمنشورُ
               على Play يفقد تحديثاته. ولو بدا الاسمُ بقيّةً من تسميةٍ قديمة.
            2. **مفتاحُ التوقيع لا يدخل المستودع** — لا `*.jks` ولا `keystore.properties`
               ولا كلمةُ سرٍّ نصّاً صريحاً في أي سكربت.
            3. **`AppConfig.kt` مصدرُ الحقيقة الوحيد لروابط الـWebView** — أيُّ رابطٍ
               حرفيٌّ يُبنى خارجه انحرافٌ صامت.
            4. **`versionCode` لا يتراجع ولا يُعاد استعماله** — Play يرفض، ورسالتُه غامضة.

            ركّز على: أخطاءٍ حقيقية · ثغراتٍ أمنية · تسريبِ أسرار · انهيارٍ وقتَ التشغيل ·
            وفشلٍ صامت. ولا تقترح إعادةَ تنسيقٍ ولا تفضيلاتٍ أسلوبية.

            ⚠️ ومراجعتُك **ساكنة**: لا تنفّذ بناءً ولا اختباراً (‏`Bash` خارج أدواتك
            المسموحة عمداً — قرارُ أمنٍ في CI لا تفصيلُ مراجعة). فلا تدّعِ أنك شغّلتَ
            شيئاً، وقُل صراحةً حين يكون حكمُك مبنياً على القراءة وحدها.

            استعمل `gh pr comment` للملاحظة العامّة، و
            `mcp__github_inline_comment__create_inline_comment` (بـ`confirmed: true`)
            للمواضع بعينها. انشر تعليقاتِ GitHub فقط — لا تُخرِج نصَّ المراجعة كرسالة.

          # 🔴 `--allowedTools` بلا أي `Bash` تنفيذيّ عدا نداءات `gh pr` القرائية —
          #    توسيعُه ليشمل `node`/`gradle` يمنح الإجراءَ تنفيذاً على كودِ فرعٍ لم
          #    يُدمج بعد، وهو قرارُ أمنٍ في CI لم يُتَّخذ.
          # 🟢 و`--model claude-sonnet-5`: مراجعةٌ ساكنة متكرّرة ⇒ كسرُ الكلفة بلا خسارةٍ
          #    تُذكر. أمّا الاستدعاءُ الصريح بـ`@claude` فيبقى على النموذج الكامل.
          # 🔴 **حُذف `--max-turns` كلّياً 2026-09-08 — والرقمُ لم يكن العلاج.**
          #    قِيس `num_turns` على ثماني تشغيلات: نجاحاتٌ عند ١١ و١١ و**١٥** (على الحدّ
          #    تماماً)، وفشلٌ عند **١٦** (‏`error_max_turns` ⇒ **صفرُ مراجعة** و$0.56 مهدورة)،
          #    وعند ٢٠ و٢٣ برسالة «‏successful result after N turns, exceeding the configured
          #    maximum of 15» ⇒ **المراجعةُ نجحت ثمّ مُحيت**. والذيلُ ١١→٢٣ ⇒ أيُّ رقمٍ
          #    نختاره رهانٌ (بند `maxturns-cap-is-a-bet`؛ و`SchoolApp-gas` سقط عند ٣٠ لِـ٣٣).
          # 🟢 والحدُّ الجامحُ يبقى قائماً: `timeout-minutes: 30` أعلاه — حدٌّ بالزمن لا
          #    بالدورات، فلا يقلب نجاحاً إلى فشلٍ بأثرٍ رجعيّ.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # ════════════════════════════════════════════════════════════════════════
      # 🔴 البوّابة: ضابطُ القبول **تعليقٌ منشور**، لا لونُ خطوة
      # ════════════════════════════════════════════════════════════════════════
      # البصمةُ مقيسةٌ من التعليقات نفسِها (2026-09-08):
      #   🟢 PR #34 ⇒ يبدأ بـ`**Claude finished` · و`pulls/34/reviews` فيها `COMMENTED`×2.
      #   🔴 PR #48 ⇒ يبدأ بـ`**Claude encountered an error` · و`reviews` **فارغة**.
      # ⚠️ وتفشل أيضاً حين **لا تعليقَ من `claude[bot]` أصلاً** — وهذا يغلق فئةَ
      #    «الإجراءُ يخضرّ وقد تخطّى التحقّق بلا نشرِ شيء».
      # 🔴 **ولا `if:` إطلاقاً — لا `always()` ولا `!cancelled()`.**
      #    `continue-on-error` على خطوة المراجعة يجعل هذه تجري في المسار الطبيعيّ.
      #    ولو سقط `Checkout` فالتخطّي **هو الصواب**: الوظيفةُ تحمرّ بسببها الصحيح،
      #    بينما `!cancelled()` كانت ستُجري البوّابةَ فتعلن «لا مراجعة» ⇒ **تشخيصٌ
      #    كاذبٌ لعطلٍ في مكانٍ آخر**. (صُحّح 2026-09-08 بعد أن كان `!cancelled()`.)
      - name: Gate on a published review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 🔴 **لا `-e` عمداً** — وهذا سدُّ فشلٍ صامتٍ **داخل علاجِ الفشل الصامت**:
          #    تحت `set -e` يُنهي أيُّ أمرٍ يعود بغير صفرٍ السكربتَ **بلا رسالة** ⇒ بوّابةٌ
          #    حمراءُ **بلا حكم**، وهي بعينها الفئةُ التي كُتبت البوّابةُ لإغلاقها.
          set -uo pipefail

          # 🔴 **حارسُ الافتراض — يُفحص قبل أيّ حكم.** شرطُ «مربّعٌ غيرُ مؤشَّر» يقوم كلُّه
          #    على قائمة تتبّعٍ ينشئها `track_progress: true`. فإن أُطفئت أو حُذفت صار
          #    `unchecked=0` **بالمصادفة لا بالاكتمال** ⇒ بوّابةٌ تخضرّ على لا شيء، وهي
          #    عينُ فئةِ «الحارس الأجوف» التي كُتبت هذه البوّابةُ لإغلاقها.
          # ⚠️ وحدُّه: يفحص **هذا الملفَّ وحده** — لا يسري على وركفلوهات أخرى.
          if ! grep -qE '^\s*track_progress:\s*true\s*$' .github/workflows/claude-review.yml; then
            # 🔴 **بلا backtick هنا عمداً** — داخل سلسلةٍ مزدوجةٍ يصير **استبدالَ أمرٍ**
            #    لا نصّاً. وقع فعلاً في هذا السطر عند كتابته 2026-09-08.
            #    ⚠️ و`bash -n` **لا يكشفه**: الاستبدالُ صحيحٌ نحوياً — قِيس. الكاشفُ
            #    الوحيد فحصُ الـbacktick على الأسطر غيرِ التعليقية.
            echo "::error::الخيار track_progress: true غاب عن claude-review.yml — وشرطُ \
          المربّعات يقوم عليه. لا يُحكَم بلا افتراضِه: عدِّل البوّابةَ أوّلاً أو أعِد الإعداد."
            exit 1
          fi

          # 🔴 مرساةُ `run_id`: جسمُ تعليق `claude[bot]` يحوي رابطَ تشغيلته حرفياً.
          #    قِيس على PR #34: التعليقُ يحوي `actions/runs/33992517567` وهو رقمُ تشغيلته.
          #    وبلا المرساة قد يُلتقط تعليقٌ من `claude.yml` (استدعاءُ `@claude`) أو من
          #    تشغيلةٍ أقدمَ على الـPR نفسِه ⇒ **بوّابةٌ تخضرّ زوراً**.
          # ⚠️ ويُستعمل jq **المدمجُ في `gh`** لا الخارجيّ: الخارجيُّ غائبٌ عن جهاز التطوير
          #    ⇒ لولا ذلك لشُحن سكربتٌ لم تُشغَّل ضوابطُه محلّياً قطّ.
          # 🔴 **ويُقرأ تعليقُ التتبّع ومعه ما يليه — لا التعليقُ الأخير وحدَه.**
          #    قِيس على PR #35: الأكشنُ ينشر **تعليقَي تتبّعٍ ومراجعة**، والمراجعةُ
          #    (‏٣٬٠٩٥ حرفاً · «‏### مراجعة …») **بلا رابطِ تشغيلةٍ إطلاقاً** لأنها تُنشر
          #    بـ`gh pr comment`، بينما تعليقُ التتبّع بقي `unchecked=1` ⇒ الحكمُ عليه
          #    وحدَه **أحمرُ كاذبٌ على مراجعةٍ منشورةٍ كاملة**.
          # 🟢 فيُحسب ثلاثيّ: مربّعاتُ تعليق التتبّع (‏`u`/`c`)، **و`sep`** = عددُ تعليقات
          #    `claude[bot]` **بعده زمنياً** بلا رابطِ تشغيلةٍ وطولُها ≥ ٥٠٠ حرف.
          #    ⚠️ وحدُّ الـ٥٠٠ مقيس: المراجعاتُ الحقيقيّة ٢٬٢٩٦–٣٬٦٧٦ حرفاً، وتعليقاتُ
          #       التتبّع ٦١٩–٧٤٥ (وهي مستثناةٌ أصلاً برابط التشغيلة).
          #    🔴 و`created_at >= t.created_at` إلزاميّ — بدونه تُحسب مراجعةُ تشغيلةٍ
          #       سابقةٍ على الـPR نفسِه شاهداً لهذه، فتخضرّ البوّابةُ زوراً.
          # 🔴 **وشرطان يضيّقان `sep` — أُضيفا 2026-09-08 بعد ثقبٍ نبّهت إليه جلسةُ
          #    `rukn-tasawuq-erp` ونُقض عندي بالقياس لا بالقبول:**
          #    `claude.yml` **بلا `track_progress`** (مقيس) ⇒ ردُّه على `@claude` تعليقُ
          #    `claude[bot]` **بلا رابطِ تشغيلة** ⇒ **كان يُحتسب `sep` فتخضرّ البوّابةُ
          #    بصفر مراجعة**. والثقبُ **نظريٌّ هنا ولم يقع** (مسحُ ٦٠ PR: صفرُ استدعاءِ
          #    `@claude` من بشر · وتعليقٌ واحدٌ بلا مرساة هو مراجعةُ #35) — **ويُسدّ لأنه
          #    ممكنٌ لا لأنه وقع**.
          #    ① **نافذةٌ زمنيّة ≤ ١٨٠٠ ثانية** = `timeout-minutes: 30` نفسُها: ما بعدها
          #       **لا يمكن أن يكون مخرَجَ هذه التشغيلة** بنيويّاً. (فجوةُ #35 = ٣د ٥١ث.)
          #    ② **وإن استدعى بشرٌ `@claude` بعد تعليق التتبّع فلا يُنسب `sep` لهذه
          #       التشغيلة** — النسبةُ تصير غيرَ قابلةٍ للتمييز، **والأسلمُ الأحمر**.
          # ⚠️ **ولا يُنقَل هذا الشرطُ إلى مستودعٍ آخر بلا قياس:** في `rukn-tasawuq-erp`
          #    نمطُ التعليق المنفصل **لا يقع أصلاً** (`sep=0` في #12 و#8) ⇒ `sep>0` هناك
          #    **خطرٌ بلا فائدة**. **القاعدةُ واحدةٌ والمعايرةُ محلّية.**
          triple=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login=="claude[bot]")] as $bot
            | [.[] | select(.user.login!="claude[bot]")] as $hum
            | ([$bot[] | select(.body | contains("actions/runs/'"${RUN_ID}"'"))] | last) as $t
            | if $t == null then "NOCOMMENT"
            else ($t.created_at | fromdateiso8601) as $t0
            | (($t.body | split("- [ ]") | length - 1)) as $u
            | (($t.body | split("- [x]") | length - 1)) as $c
            | ([$bot[] | select((.created_at|fromdateiso8601) >= $t0)
                | select((.created_at|fromdateiso8601) <= ($t0 + 1800))
                | select(.body | contains("actions/runs/") | not)
                | select((.body|length) >= 500)] | length) as $e
            | ([$hum[] | select((.created_at|fromdateiso8601) >= $t0)
                | select(.body | contains("@claude"))] | length) as $m
            | "\($u) \($c) \($e) \($m)"
            end' 2>&1)
          rc=$?

          # 🔴 ويُفصَل «تعذّر الاستعلام» عن «لا تعليق»: خلطُهما يُعلن نتيجةً من قياسٍ ناقص.
          if [ "$rc" -ne 0 ]; then
            echo "::error::تعذّر الاستعلامُ عن تعليقات الـPR — **قياسٌ ناقصٌ لا نتيجة**."
            printf '%s\n' "$triple" | head -n 3
            exit 1
          fi

          if [ "$triple" != "NOCOMMENT" ]; then
            unchecked=$(printf '%s' "$triple" | awk '{print $1}')
            checked=$(printf '%s'   "$triple" | awk '{print $2}')
            separate=$(printf '%s'  "$triple" | awk '{print $3}')
            mention=$(printf '%s'   "$triple" | awk '{print $4}')

            # 🔴 استدعاءُ `@claude` بعد تعليق التتبّع يجعل نسبةَ التعليق المنفصل
            #    **غيرَ قابلةٍ للتمييز** بين مراجعةٍ وجوابِ استدعاء ⇒ يُلغى `sep`.
            if [ "${mention:-0}" -gt 0 ] && [ "$separate" -gt 0 ]; then
              echo "::warning::أُلغيت شهادةُ التعليق المنفصل: استُدعي @claude ${mention} مرّةً \
          بعد تعليق التتبّع ⇒ لا يُميَّز جوابُ الاستدعاء من المراجعة. الحكمُ بالمربّعات وحدَها."
              separate=0
            fi
            # 🔴 **الرأسُ ليس حكماً — مُثبَتٌ بالأثر:** #36 و#32 رأسُهما «error»
            #    ومراجعتُهما منشورةٌ كاملة (‏checked=8/6 · len 5478/5022)، وهما تشغيلتا
            #    «تجاوزِ السقف» ⇒ الفحصُ البعديُّ للسقف كتب رأسَ «error» فوق نجاح.
            # 🟢 **والقاعدةُ المحمولة:** يخضرّ إن (‏قائمةُ التتبّع اكتملت: unchecked=0
            #    و checked>0) **أو** (‏نُشرت مراجعةٌ في تعليقٍ منفصلٍ بعده: separate>0).
            #    ⚠️ ولا عددُ المراجعات ولا رأسُ «Claude finished» في الحكم — كلاهما
            #       **مشروطٌ بالمستودع**: yemen-schoolz#11 مراجعةٌ كاملةٌ بـreviews=0،
            #       ومراجعةٌ بلا ملاحظاتٍ موضعيّة لا تُنشئ review أصلاً
            #       (‏#33 و#24 هنا: reviews=0 ومراجعةٌ كاملةٌ منشورة).
            if { [ "$unchecked" -eq 0 ] && [ "$checked" -gt 0 ]; } || [ "$separate" -gt 0 ]; then
              echo "OK - review published for run ${RUN_ID} (u=${unchecked} c=${checked} sep=${separate})."
              echo "review-published=true · u=${unchecked} · c=${checked} · sep=${separate}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "::error::المراجعةُ لم تكتمل ولم تُنشر منفصلةً — قائمةُ التتبّع: \
          غيرُ مؤشَّر=${unchecked} · مؤشَّر=${checked} · تعليقاتٌ منفصلةٌ لاحقة=${separate}."
            echo "review-published=false · u=${unchecked} · c=${checked} · sep=${separate}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # ── لا تعليقَ لهذه التشغيلة: يُشخَّص السببُ ويُسمّى، **ولا يُعفى** ────────────
          # 🟢 **يُقاس السببُ نفسُه لا خبرٌ عنه** (بُدِّل 2026-09-08 عن `gh pr diff`):
          #    الأكشنُ يشترط تطابقَ ملفّ الوركفلو مع نسخته على الفرع الافتراضيّ ⇒ تُقارَن
          #    بصمتا الملفّ مباشرةً، وكلتاهما متاحةٌ **لحظةَ التشغيل** لا بعد انتهائه.
          # 🎯 وهو أدقُّ من فحص الـdiff: يلتقط زيادةً **الفرعَ القديمَ الذي اختلفت نسختُه
          #    بلا أن يمسّها أحد** — حالةٌ لا يراها `gh pr diff` إطلاقاً.
          # 🟢 مقيسٌ على هذا المستودع: PR #49 (يمسّ الوركفلو) ⇒ بصمتان مختلفتان ·
          #    PR #36 (لا يمسّه) ⇒ **متطابقتان** ⇒ يكشف ولا يُنذر كاذباً.
          WF=".github/workflows/claude-review.yml"
          sha_head=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WF}?ref=${HEAD_SHA}" --jq .sha 2>/dev/null)
          sha_base=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WF}?ref=${DEFAULT_BRANCH}" --jq .sha 2>/dev/null)

          if [ -n "${sha_head:-}" ] && [ -n "${sha_base:-}" ] && [ "$sha_head" != "$sha_base" ]; then
            echo "::error::الأكشنُ تخطّى نفسَه بـ«workflow validation»: نسخةُ ${WF} على هذا \
          الفرع (${sha_head}) تخالف نسخةَ ${DEFAULT_BRANCH} (${sha_base}) — وهو متوقَّعٌ \
          ويعمل بعد الدمج. 🔴 لكنّ المراجعةَ لم تجرِ، فالأحمرُ صادقٌ ومعناه «لم تُراجَع». \
          والدمجُ قرارُ بشرٍ لا لونُ فحص."
          else
            echo "::error::لا تعليقَ من claude[bot] لهذه التشغيلة (${RUN_ID}) — المراجعةُ \
          لم تُنشَر. وحالةُ خطوة المراجعة: ${REVIEW_OUTCOME} · بصمتا الوركفلو: \
          ${sha_head:-?} / ${sha_base:-?}."
          fi
          {
            echo "review-published=false"
            echo "review-step-outcome=${REVIEW_OUTCOME}"
            echo "workflow-sha-head=${sha_head:-?}"
            echo "workflow-sha-base=${sha_base:-?}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
