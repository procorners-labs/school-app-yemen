# ═══════════════════════════════════════════════════════════════════════════
# libs.versions.toml — مرجع الإصدارات الموحّد لمشروع SchoolApp Yemen
# يُستخدم في build.gradle.kts عبر: libs.<category>.<name>
# ═══════════════════════════════════════════════════════════════════════════

[versions]
# ── Build tools ────────────────────────────────────────────────────────────
agp                 = "8.13.2"
kotlin              = "1.9.0"

# ── Core ───────────────────────────────────────────────────────────────────
coreKtx             = "1.15.0"
appcompat           = "1.7.0"
splashscreen        = "1.0.1"

# ── UI ─────────────────────────────────────────────────────────────────────
material            = "1.12.0"
constraintlayout    = "2.2.0"
swiperefreshlayout  = "1.1.0"

# ── Support ────────────────────────────────────────────────────────────────
multidex            = "2.0.1"
webkit              = "1.12.1"
biometric           = "1.1.0"
securityCrypto      = "1.0.0"
activityKtx         = "1.9.3"
lifecycleRuntimeKtx = "2.8.7"

# ── Testing ────────────────────────────────────────────────────────────────
junit               = "4.13.2"
androidxJunit       = "1.2.1"
espressoCore        = "3.6.1"
googleGmsGoogleServices = "4.5.0"
googleFirebaseCrashlytics = "3.0.7"

# ── Firebase (BoM يدير كل إصدارات مكتبات Firebase أدناه — لا نُثبِّت إصداراً فردياً) ──
firebaseBom         = "33.7.0"

# ═══════════════════════════════════════════════════════════════════════════
[libraries]
# ── Core ───────────────────────────────────────────────────────────────────
androidx-core-ktx              = { group = "androidx.core",              name = "core-ktx",              version.ref = "coreKtx"             }
androidx-appcompat             = { group = "androidx.appcompat",          name = "appcompat",             version.ref = "appcompat"            }
androidx-core-splashscreen     = { group = "androidx.core",              name = "core-splashscreen",      version.ref = "splashscreen"         }

# ── UI ─────────────────────────────────────────────────────────────────────
material                       = { group = "com.google.android.material", name = "material",              version.ref = "material"             }
androidx-constraintlayout      = { group = "androidx.constraintlayout",  name = "constraintlayout",      version.ref = "constraintlayout"     }
androidx-swiperefreshlayout    = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout",   version.ref = "swiperefreshlayout"   }

# ── Support ────────────────────────────────────────────────────────────────
androidx-multidex              = { group = "androidx.multidex",          name = "multidex",              version.ref = "multidex"             }
androidx-webkit                = { group = "androidx.webkit",            name = "webkit",                version.ref = "webkit"               }
androidx-biometric             = { group = "androidx.biometric",         name = "biometric",             version.ref = "biometric"            }
androidx-security-crypto       = { group = "androidx.security",          name = "security-crypto",       version.ref = "securityCrypto"       }
androidx-activity-ktx          = { group = "androidx.activity",          name = "activity-ktx",          version.ref = "activityKtx"          }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx"  }

# ── Testing ────────────────────────────────────────────────────────────────
junit                          = { group = "junit",                      name = "junit",                 version.ref = "junit"                }
androidx-junit                 = { group = "androidx.test.ext",          name = "junit",                 version.ref = "androidxJunit"        }
androidx-espresso-core         = { group = "androidx.test.espresso",     name = "espresso-core",         version.ref = "espressoCore"         }

# ── Firebase (إصدارات كل مكتبة تُدار عبر firebase-bom — لا version.ref هنا عمداً) ──
firebase-bom          = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics  = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-messaging    = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# ═══════════════════════════════════════════════════════════════════════════
[plugins]
android-application        = { id = "com.android.application",       version.ref = "agp"    }
jetbrains-kotlin-android   = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "googleFirebaseCrashlytics" }
