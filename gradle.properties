# ═══════════════════════════════════════════════════════════════════════════
# gradle.properties — إعدادات البناء لمشروع SchoolApp Yemen
# ═══════════════════════════════════════════════════════════════════════════

# ── JVM الرئيسي ────────────────────────────────────────────────────────────
# -Duser.language=en -Duser.country=US : الحل الجذري لخطأ classes٢.dex
#   السبب: Windows بواجهة عربية يجعل Java يُولّد أرقاماً هندية-عربية (٢،٣…)
#   عند تسمية ملفات dex، بينما APK packager يتوقع أرقاماً لاتينية (2,3…).
# -Xmx4096m : ذاكرة كافية تمنع انهيار Kotlin daemon (كان يسبب fallback بطيئاً)
# -XX:+UseG1GC : جامع قمامة مناسب للعمليات الطويلة
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -XX:+UseG1GC

# ── Kotlin Compiler ─────────────────────────────────────────────────────────
# in-process: يُترجَم Kotlin داخل عملية Gradle مباشرةً
# يُحلّ مشكلة "Could not connect to Kotlin compile daemon" على ويندوز
# (سببها مشكلة شبكة/firewall بين الـ daemons)
kotlin.compiler.execution.strategy=in-process

# ── Android ────────────────────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=37,37.0
# R8 في وضعه الكامل — إجراء مقترَح من Play Console على vc31 («تحسين الذاكرة والأداء في
# تطبيقك من خلال تحسين الأداة R8»). الافتراضي في AGP 8 هو `true` أصلاً، ويُثبَّت هنا صراحةً
# كي لا يسقط بصمت لو تغيّر الافتراضي، ولأن الإجراء المقترَح يقيس المخرَج لا النيّة.
android.enableR8.fullMode=true

# ── Gradle Performance ──────────────────────────────────────────────────────
# 🔴 أُزيل من هنا `org.gradle.java.home` في 2026-08-29 — ولا يُعاد.
# كان يحمل مساراً **مطلقاً خاصّاً بجهازٍ واحد**:
#     C:/Program Files/Android/Android Studio1/jbr
# ⇒ أي بناءٍ خارج ذلك الجهاز يفشل، وأي إعادة تثبيتٍ لـAndroid Studio تكسره
# (واسمُ «Android Studio1» نفسه أثرُ إعادة تثبيتٍ وقعت فعلاً).
# وظلّ العطلُ مخفيّاً لأنه لا CI كان يبني أصلاً؛ ظهر في أوّل تشغيلٍ لـbuild.yml:
#     Value '…/jbr' given for org.gradle.java.home … is invalid
#
# 🟢 والموضعُ الصحيح لإعدادٍ يخصّ الجهاز: `~/.gradle/gradle.properties` (غيرُ متتبَّع)
# — يقرأه Gradle لكل المشاريع ويعلو على ما هنا. وقد نُقل إليه فعلاً على جهاز المالك،
# فالبناءُ المحلّي لم يتغيّر. وCI يستعمل JAVA_HOME الذي يضبطه actions/setup-java.
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
# Configuration cache تعطّل مع in-process Kotlin strategy على Gradle 8.14+
org.gradle.configuration-cache=false
# تعطيل instrumentation agent لحل تعارض Kotlin 1.9.0 مع Gradle 8.14 (BuildTime class)
org.gradle.internal.instrumentation.agent=false
kotlin.incremental=true
